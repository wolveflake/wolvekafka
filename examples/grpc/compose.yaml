# Kafka, WolveKafka, and two gRPC handlers (Python and Go) sharing one topic.
name: wolvekafka-grpc

services:
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in orders orders.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done

  handler-python:
    build:
      context: ../..
      dockerfile: examples/grpc/python/Dockerfile

  handler-go:
    build:
      context: ../..
      dockerfile: examples/grpc/go/Dockerfile

  wks:
    # gRPC handlers need WolveKafka v0.3.0 or later. Until it is released this
    # builds the current checkout; set WKS_IMAGE to use a published image.
    image: ${WKS_IMAGE:-wolvekafka:local}
    build:
      context: ../..
      dockerfile: examples/quickstart/Dockerfile
    command: ["--config_path=/etc/wks/config.json"]
    environment:
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
    depends_on:
      handler-python:
        condition: service_started
      handler-go:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./config.json:/etc/wks/config.json:ro
