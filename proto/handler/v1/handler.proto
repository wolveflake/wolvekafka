syntax = "proto3";

// The contract between WolveKafka and a handler.
//
// HTTP handlers receive LambdaRequest as JSON and reply with LambdaResponse as
// JSON. gRPC handlers implement HandlerService. Both use the same messages.
//
// Compatibility rules for this package:
//   - Fields may be added. Field numbers and names are never reused,
//     renumbered, or given a new meaning; removed fields are reserved.
//   - The JSON form sent to HTTP handlers stays byte-for-byte stable.
//   - An incompatible change goes in a new package (wolvekafka.handler.v2),
//     served alongside this one.
package wolvekafka.handler.v1;

option go_package = "wolvekafka/proto/handler/v1;handlerv1";
option java_multiple_files = true;
option java_package = "io.wolveflake.wolvekafka.handler.v1";
option csharp_namespace = "Wolveflake.WolveKafka.Handler.V1";

enum MessageEncoding {
  // Default encoding (no specific encoding)
  ENCODING_DEFAULT = 0;
  // JSON encoding
  ENCODING_JSON = 1;
}

// kafka message header.
message Header {
  // Header name (utf-8 string)
  string key = 1;

  // Header value (nil, empty, or binary)
  bytes value =2; // Header value (nil, empty, or binary)
}

// kafka message structure for lambda processing.
message KafkaMessage {
  // Topic name.
  string topic = 1;

  // Partition number.
  int32 partition = 2;

  // Message offset.
  int64 offset = 3;

  // Message headers.
  repeated Header headers = 4;

  bytes key = 5;
  bytes value = 6;

  // Encoding of the message value.
  MessageEncoding encoding = 7;
}

message LambdaRequest {
  repeated KafkaMessage messages = 1;
}

enum ResponseStatus {
  // Processing failed, retry processing.
  STATUS_RETRY = 0;
  // Processing failed, do not retry.
  STATUS_FAILED = 1;
  // Processing succeeded.
  STATUS_SUCCESS = 2;
}

message ResponseMessage {
  ResponseStatus status = 1;
  // Optional message as a response from lambda.
  bytes message = 2;
  // Encoding of the response message.
  MessageEncoding encoding = 3;
}

// lambda processing response message
message LambdaResponse {
  repeated ResponseMessage messages = 1;
}

// HandlerService is implemented by gRPC handlers. WolveKafka calls Handle once
// per batch, at /wolvekafka.handler.v1.HandlerService/Handle.
service HandlerService {
  // Handle processes a batch. The response must hold one ResponseMessage per
  // input message, in the same order. Report a bad record with a per-record
  // STATUS_FAILED rather than a call-level error.
  rpc Handle(LambdaRequest) returns (LambdaResponse);
}
