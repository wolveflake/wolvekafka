syntax = "proto3";

package configs;
option go_package = "wolvekafka/proto/configs";

import "proto/configs/cluster.proto";

message DropAction {
}

message DLQAction {
    // Kafka cluster for the DLQ.
    Cluster cluster = 1;

    // Topic for the DLQ.
    string topic = 2;

    // Maximum number of attempts to move the message to the DLQ.
    uint32 max_attempts = 3;
}

message ExponentialBackoff {
    // Initial backoff duration in milliseconds.
    int32 initial_backoff_ms = 1;

    // Maximum backoff duration in milliseconds.
    int32 max_backoff_ms = 2;

    // Backoff multiplier.
    double multiplier = 3;
}

// Retry policy for message consumption.
message RetryPolicy {
    oneof retry_policy {
      // Exponential backoff strategy.
      ExponentialBackoff exponential_backoff = 1;
    }

    oneof action {
      // Immediately drop the message after retries are exhausted.
      DropAction drop = 4;

      // Move the message to a dead-letter queue (DLQ).
      DLQAction dlq = 5;
    }
}

// Lambda represents a serverless function that can be invoked as part of a workflow.
message Lambda {
  // Required.
  // url is the endpoint where the lambda can be accessed.
  string url = 1;

  // Optional. Default is 100.
  // weight is used to determine the probability of selecting this lambda when multiple lambdas are available.
  uint32 weight = 2;
}

message BatchConsumer {
  // number of messages to process in a single batch.
  uint32 batch_size = 1;
}

message ParallelConsumer {
  // number of parallel threads to process messages.
  uint32 parallelism = 1;
}

message Consumer {
    // Unique identifier for the consumer group.
    string group_id = 1;

    // List of topics the consumer subscribes to.
    repeated string topics = 2;

    // List of lambdas associated with the consumer.
    repeated Lambda lambdas = 3;

    RetryPolicy retry_policy = 4;

    // Type of consumer.
    oneof ConsumerType {
      BatchConsumer batch = 10;
      ParallelConsumer parallel= 11;
    }
}
