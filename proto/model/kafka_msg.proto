syntax = "proto3";

package model;
option go_package = "wolvekafka/proto/model";

enum MessageEncoding {
  // Default encoding (no specific encoding)
  ENCODING_DEFAULT = 0;
  // JSON encoding
  ENCODING_JSON = 1;
}

// kafka message header.
message Header {
  // Header name (utf-8 string)
  string key = 1;

  // Header value (nil, empty, or binary)
  bytes value =2; // Header value (nil, empty, or binary)
}

// kafka message structure for lambda processing.
message KafkaMessage {
  // Topic name.
  string topic = 1;

  // Partition number.
  int32 partition = 2;

  // Message offset.
  int64 offset = 3;

  // Message headers.
  repeated Header headers = 4;

  bytes key = 5;
  bytes value = 6;

  // Encoding of the message value.
  MessageEncoding encoding = 7;
}

message LambdaRequest {
  repeated KafkaMessage messages = 1;
}

enum ResponseStatus {
  // Processing failed, retry processing.
  STATUS_RETRY = 0;
  // Processing failed, do not retry.
  STATUS_FAILED = 1;
  // Processing succeeded.
  STATUS_SUCCESS = 2;
}

message ResponseMessage {
  ResponseStatus status = 1;
  // Optional message as a response from lambda.
  bytes message = 2;
  // Encoding of the response message.
  MessageEncoding encoding = 3;
}

// lambda processing response message
message LambdaResponse {
  repeated ResponseMessage messages = 1;
}

