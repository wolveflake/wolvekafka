name: Publish release artifacts

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and source
        id: source
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a SemVer tag (for example v0.1.0 or v0.1.0-rc.1)" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "Release tag and checked-out commit differ" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit must be on main" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.5.0
        with:
          go-version: '1.25.1'
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0

      - name: Test release packaging and chart
        run: |
          go test ./scripts/release
          helm lint services/wks
          bash -n scripts/release/build-binaries.sh

      - name: Prepare release output
        run: mkdir -p dist

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.21.0
        with:
          path: .
          format: spdx-json
          output-file: dist/source.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Build Linux binaries and chart
        env:
          TAG: ${{ steps.source.outputs.tag }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          scripts/release/build-binaries.sh "$TAG" "$GITHUB_SHA" dist
          helm package services/wks \
            --version "$VERSION" --app-version "$TAG" --destination dist

      - name: Write SHA-256 checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz *.spdx.json > SHA256SUMS

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: examples/quickstart/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:${{ steps.source.outputs.tag }}
          build-args: |
            VERSION=${{ steps.source.outputs.tag }}
            VCS_REF=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - name: Publish OCI Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/wks-$VERSION.tgz" \
            "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

      # GitHub's artifact-attestation service requires a public repository (or
      # an eligible enterprise plan). Buildx still publishes image provenance.
      - name: Attest release files
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: dist/*

      - name: Attest container image
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Upload release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.source.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
