name: Check release artifacts

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.5.0
        with:
          go-version: '1.25.1'
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0

      - name: Build and validate release files
        run: |
          go test ./scripts/release
          helm lint services/wks
          go run scripts/release/chart-version.go -check
          scripts/release/build-binaries.sh v0.0.0-test "$GITHUB_SHA" dist
          helm package services/wks \
            --version 0.0.0 --app-version v0.0.0-test --destination dist
          test -f dist/wks_v0.0.0-test_linux_amd64.tar.gz
          test -f dist/wks_v0.0.0-test_linux_arm64.tar.gz
          test -f dist/wks-0.0.0.tgz
          cd dist
          sha256sum -- *.tar.gz *.tgz > SHA256SUMS
          sha256sum -c SHA256SUMS
          grep -Fq 'wks-0.0.0.tgz' SHA256SUMS
