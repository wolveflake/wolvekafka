name: Bug report
description: Report a reproducible WKS defect (not a security vulnerability).
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: >
        Please search existing issues first. Redact credentials, tokens, and
        customer data. For vulnerabilities, follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: WKS version or commit
      placeholder: v0.1.0 or full commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, deployment method, Kafka version/provider, and relevant settings (sanitized).
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal config and handler response if relevant; remove secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and impact
      description: Include sanitized logs or metrics if available.
    validations:
      required: true
