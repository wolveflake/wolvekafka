## Strimzi Kafka cluster configuration

## Cluster name used in Strimzi CRs and Kubernetes labels.
clusterName: wolvekafka

kafka:
  ## Kafka version managed by Strimzi.
  version: "4.2.0"
  metadataVersion: "4.2-IV1"

  ## Number of broker/controller nodes.
  replicas: 1

  ## Listener configuration.
  listeners:
    ## Internal plain-text listener.
    plain:
      port: 9092
      tls: false
    ## Internal TLS listener.
    tls:
      port: 9093
      tls: true

  ## Kafka broker configuration overrides.
  config:
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1
    default.replication.factor: 1
    min.insync.replicas: 1

  ## Storage for Kafka data (persistent-claim backed).
  storage:
    size: 5Gi
    ## Set to "" to use the cluster default StorageClass.
    storageClassName: ""

  ## Resource requests and limits.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 1500Mi

## Entity Operator (manages KafkaTopic and KafkaUser CRs).
entityOperator:
  topicOperator:
    enabled: true
  userOperator:
    enabled: true
