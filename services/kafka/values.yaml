# Default values for kafka-demo.
# This chart intentionally keeps the footprint very small so you can demo Kafka
# clusters on DigitalOcean Kubernetes without over-provisioning.

global:
  imagePullSecrets: []
  storageClass: ""

image:
  kafka:
    repository: bitnami/kafka
    tag: 3.6.1-debian-11-r13
    pullPolicy: IfNotPresent
  zookeeper:
    repository: bitnami/zookeeper
    tag: 3.9.1-debian-11-r18
    pullPolicy: IfNotPresent

kafka:
  replicaCount: 1
  heapOpts: "-Xmx512m -Xms512m"
  service:
    type: ClusterIP
    port: 9092
    nodePort: null
    external:
      enabled: false
      type: LoadBalancer
      port: 9094
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 1500Mi
  config:
    offsetsTopicReplicationFactor: 1
    transactionStateLogReplicationFactor: 1
    transactionStateLogMinIsr: 1
    defaultReplicationFactor: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

zookeeper:
  replicaCount: 1
  servicePort: 2181
  tickTime: 2000
  initLimit: 10
  syncLimit: 5
  persistence:
    enabled: false
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

podAnnotations: {}
