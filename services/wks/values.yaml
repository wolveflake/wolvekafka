replicaCount: 1
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/wolveflake/wolvekafka
  # Empty uses the chart's appVersion, which is set from the release tag.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: example.do.k8s.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

config:
  enabled: true
  mountPath: /etc/wks/config
  fileName: config.json
  path: /etc/wks/config/config.json
  data: |
    {
      "cluster": {
        "bootstrap_servers": [
          "wolvekafka-kafka-bootstrap:9092"
        ]
      },
      "consumers": [
        {
          "group_id": "demo-group",
          "topics": [
            "demo-topic"
          ],
          "lambdas": [
            {
              "url": "http://lambda.wolvekafka.svc.cluster.local:8081/hello"
            }
          ]
        }
      ]
    }

env:
  - name: LOG_LEVEL
    value: info
  - name: PORT
    value: "8080"

extraEnvFrom: []

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}

tolerations: []

affinity: {}

extraVolumes: []

extraVolumeMounts: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1
