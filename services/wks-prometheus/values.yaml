nameOverride: ""
fullnameOverride: ""

wks:
  replicaCount: 1
  image:
    repository: ghcr.io/wolveflake/wks
    tag: latest
    pullPolicy: IfNotPresent
    pullSecrets: []
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    - name: LOG_LEVEL
      value: info
    - name: PORT
      value: "8080"
  config:
    enabled: true
    fileName: config.json
    mountPath: /etc/wks/config
    data: |
      {
        "cluster": {
          "bootstrap_servers": [
            "demo-kafka-kafka-demo-kafka:9092"
          ]
        },
        "consumers": [
          {
            "group_id": "demo-group",
            "topics": [
              "demo-topic"
            ],
            "lambdas": [
              {
                "url": "http://lambda-lambda.wks-demo.svc.cluster.local:8081/hello"
              }
            ]
          }
        ]
      }
  readinessProbe:
    path: /health
    port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    path: /health
    port: http
    initialDelaySeconds: 10
    periodSeconds: 15

prometheus:
  image:
    repository: docker.io/prom/prometheus
    tag: v2.51.0
    pullPolicy: IfNotPresent
  retention: 6h
  scrapeInterval: 15s
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 9090
