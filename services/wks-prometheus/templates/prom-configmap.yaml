apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wks-prometheus.fullname" . }}-prom-config
  labels:
    {{- include "wks-prometheus.promLabels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
    scrape_configs:
      - job_name: "wks"
        static_configs:
          - targets:
              - "{{ include "wks-prometheus.fullname" . }}-wks:{{ .Values.wks.service.port }}"
            labels:
              namespace: {{ .Release.Namespace }}
