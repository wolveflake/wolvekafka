apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wks-prometheus.fullname" . }}
  labels:
    {{- include "wks-prometheus.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "wks-prometheus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wks-prometheus.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "wks-prometheus.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $imageRef := printf "%s:%s" .Values.image.repository .Values.image.tag -}}
      {{- if .Values.image.digest }}
        {{- $imageRef = printf "%s@%s" .Values.image.repository .Values.image.digest -}}
      {{- end }}
      containers:
        - name: {{ include "wks-prometheus.name" . }}
          image: "{{ $imageRef }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.config.enabled }}
          args:
            - --config_path={{ .Values.config.path }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if and .Values.livenessProbe .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if and .Values.readinessProbe .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- $extraVolumeMounts := default (list) .Values.extraVolumeMounts }}
          {{- if or .Values.config.enabled (gt (len $extraVolumeMounts) 0) }}
          volumeMounts:
            {{- if .Values.config.enabled }}
            - name: wks-config
              mountPath: {{ .Values.config.mountPath }}
              readOnly: true
            {{- end }}
            {{- with $extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- $extraVolumes := default (list) .Values.extraVolumes }}
      {{- if or .Values.config.enabled (gt (len $extraVolumes) 0) }}
      volumes:
        {{- if .Values.config.enabled }}
        - name: wks-config
          configMap:
            name: {{ include "wks-prometheus.fullname" . }}-config
        {{- end }}
        {{- with $extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
