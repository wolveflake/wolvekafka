apiVersion: v1
kind: Service
metadata:
  name: {{ include "wks-prometheus.fullname" . }}-wks
  labels:
    {{- include "wks-prometheus.wksLabels" . | nindent 4 }}
spec:
  type: {{ .Values.wks.service.type }}
  selector:
    {{- include "wks-prometheus.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: wks
  ports:
    - name: http
      port: {{ .Values.wks.service.port }}
      targetPort: http
      protocol: TCP
