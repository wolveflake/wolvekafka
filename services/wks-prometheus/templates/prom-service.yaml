apiVersion: v1
kind: Service
metadata:
  name: {{ include "wks-prometheus.fullname" . }}-prometheus
  labels:
    {{- include "wks-prometheus.promLabels" . | nindent 4 }}
spec:
  type: {{ .Values.prometheus.service.type }}
  selector:
    {{- include "wks-prometheus.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  ports:
    - name: http
      port: {{ .Values.prometheus.service.port }}
      targetPort: http
      protocol: TCP
