apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka-demo.zookeeperServiceName" . }}
  labels:
    {{- include "kafka-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: zookeeper
spec:
  type: ClusterIP
  ports:
    - name: client
      port: {{ .Values.zookeeper.servicePort }}
      targetPort: client
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: zookeeper
